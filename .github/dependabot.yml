# Once a month, one pull request per ecosystem for every minor and patch
# update together; a major update comes alone. The assistant takes them when
# the checks pass (AGENTS.md). Security alerts arrive by themselves.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    allow:
      - dependency-type: direct
    # typescript and @types/node move by hand, with the Node version.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm:
        update-types: [minor, patch]
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/frontend/app"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(app)"
    groups:
      app:
        update-types: [minor, patch]
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/tools/sbom"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(sbom)"

  - package-ecosystem: cargo
    directory: "/native"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(cargo)"
    # The shell's Windows-only code takes types from the `windows` and
    # `webview2-com` versions that Tauri uses. A bump of either alone would
    # leave two versions in Cargo.lock and break the Windows build, so they
    # move by hand, with a Tauri update.
    ignore:
      - dependency-name: "windows"
      - dependency-name: "webview2-com"
    groups:
      cargo:
        update-types: [minor, patch]
        patterns: ["*"]
