version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "main"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: npm
    directory: "/"
    target-branch: "main"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(deps)"
    groups:
      tooling:
        update-types:
          - minor
          - patch
        patterns:
          - "husky"
          - "lint-staged"
          - "prettier"
          - "eslint"
          - "@typescript-eslint/*"
          - "eslint-plugin-*"
          - "typescript-eslint"

  - package-ecosystem: npm
    directory: "/frontend/app"
    target-branch: "main"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    allow:
      - dependency-type: direct
    # Mirror the root npm ignore: @types/node + typescript majors are
    # intentionally deferred (see CHANGELOG). @types/node lives in this
    # workspace, so the rule has to be here too — its absence is what let
    # the @types/node 25 major PR (#119) open.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(frontend-deps)"

  # The SBOM generator's own lockfile (2026-09 production readiness, Slice 12).
  # Only the release-evidence workflow installs it; the `supply-chain` job
  # audits it on every push, like the root lockfile.
  - package-ecosystem: npm
    directory: "/tools/sbom"
    target-branch: "main"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(sbom-tools)"

  # Single cargo entry covers the whole native/ workspace (introduced in
  # `bb777ed`). Update-types for the runtime, protocol, and shell crates
  # all flow through here; the patterns below group related dependencies
  # so they ship as one PR rather than three.
  - package-ecosystem: cargo
    directory: "/native"
    target-branch: "main"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(native-deps)"
    # New pages program, Slice 3: the shell's Windows-only COM code
    # (`set_browser_accelerator_keys_off` in native/tauri-shell/src/main.rs)
    # takes wry's `ICoreWebView2Controller` and returns `windows::core::Result`,
    # so `windows` and `webview2-com` must stay at the versions Tauri and wry
    # use. A bump of either alone would leave two versions in Cargo.lock and
    # break the Windows build, which no CI job compiles; they move by hand,
    # with a Tauri update. `scripts/check-no-shortcuts.test.mjs` holds the lock.
    ignore:
      - dependency-name: "windows"
      - dependency-name: "webview2-com"
    groups:
      native-runtime:
        update-types:
          - minor
          - patch
        patterns:
          - "rusqlite"
          - "serde"
          - "serde_json"
      native-shell:
        update-types:
          - minor
          - patch
        patterns:
          - "tauri"
          - "tauri-build"
      native-tooling:
        update-types:
          - minor
          - patch
        patterns:
          - "ts-rs"
          - "ts-rs-macros"
