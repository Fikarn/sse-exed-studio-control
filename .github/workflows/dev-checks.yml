name: dev-checks

on:
  pull_request:
  # Production readiness 2026-09, Slice 0 (finding F03): run on every branch
  # push, not only on `main`, so a pushed slice is checked before a pull
  # request exists. Dependabot branches are excluded because they already get
  # a `pull_request` run and would otherwise run twice.
  push:
    branches: ["**", "!dependabot/**"]

permissions:
  contents: read

# actions/upload-artifact@v4 still ships a Node.js 20 runtime (actions/cache
# is on v6). Opt it into Node 24 now — GitHub forces it from 2026-06-16 and the
# actions already support it — so the deprecation warning clears ahead of the
# runner change without waiting on a new action major.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Cancel in-flight runs of this workflow on the same ref when a new push lands
# (plan PR 1 / workstream B6 concurrency portion). Path filters are deferred
# to a later PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required merge hygiene on protected branches. Never a release gate.
# Target-host release evidence on macOS Apple Silicon and Windows 11 x64
# remains the release acceptance mechanism for this repo (see AGENTS.md).
jobs:
  format-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run scripts:test
      - run: npm run release:check
      - run: npm run file:health
      - run: npm run protocol:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run frontend:typecheck

  # Vitest unit + component tests across the frontend workspaces (app, design
  # system, engine client, tokens, shared graphics), then the coverage floors
  # of the app, the design system and the engine client (production
  # readiness Slice 13).
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run frontend:test
      # Production readiness S13 (finding F25): the Vitest coverage floors of the
      # app, the design system and the engine client (measured minus two points;
      # each workspace's vitest.config.ts).
      - run: npm run frontend:test:coverage

  # Production readiness 2026-09, Slice 12 (finding F17): what the repository
  # depends on is checked on every push. Three checks, each of which reports
  # even when another has failed:
  # - `supply-chain:npm` — `npm audit` for every lockfile (the shipped tree from
  #   moderate, the build-and-test tree and `tools/sbom` from high) against
  #   `scripts/npm-audit-allowlist.json`, whose entries expire;
  # - the "review by" date on every advisory `native/deny.toml` ignores;
  # - `cargo deny check`: advisories, bans, licenses, sources.
  # All three read lockfiles only, so nothing is installed or built here. They
  # also read the advisory databases as they are today: this job can turn red
  # on a push that changed nothing, and that is the point of it.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm audit against the allowlist
        run: npm run supply-chain:npm
      - name: cargo-deny ignore dates
        if: ${{ !cancelled() }}
        run: node scripts/check-deny-ignores.mjs
      - name: cargo deny check (advisories, bans, licenses, sources)
        if: ${{ !cancelled() }}
        # Third-party action, pinned to the commit behind v2.1.1; Dependabot's
        # github-actions updates move the pin.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: native/Cargo.toml
          # native/rust-toolchain.toml pins this; the action's image has to match it.
          rust-version: "1.95.0"

  # plan PR 1 / workstream B1 + B2 (consolidated).
  # `frontend:playwright:test` now includes the `visual-review.spec.ts`
  # baseline diff (workstream A1), so this single job covers both the
  # `frontend-e2e` and `visual-review` jobs from the plan — sharing the
  # Vite preview server boot cost as B2 suggests.
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/app/package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browser deps (chromium)
        working-directory: frontend/app
        run: npx playwright install --with-deps chromium
      # Production readiness S13 (findings F25, F03). The job fails on the `default`
      # project: every case but the few named in frontend/app/tests/quarantine.json,
      # whose assertions are wall-clock measurements. That list is checked first —
      # short, explained, no gate on it, and an exit date after which this step
      # fails until the cases are back in `default` or gone.
      - name: Quarantine list (short, explained, dated)
        run: npm run frontend:playwright:quarantine:check
      - name: Playwright, default project (blocking)
        run: npm run frontend:playwright:test:blocking
      # One worker, two retries, its own output folders; it reports and never
      # fails the job. It reuses the builds of the step above, so it is skipped
      # when that step did not get as far as running.
      - name: Playwright, quarantine project (advisory)
        id: quarantine
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-quarantine
        run: npm run frontend:playwright:test:quarantine
      - name: Say what the quarantine project did
        if: ${{ !cancelled() }}
        env:
          QUARANTINE_OUTCOME: ${{ steps.quarantine.outcome }}
        run: |
          echo "Quarantine project (advisory, frontend/app/tests/quarantine.json): ${QUARANTINE_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${QUARANTINE_OUTCOME}" != "success" ]; then
            echo "::warning title=Quarantined Playwright cases::The quarantine project ended as ${QUARANTINE_OUTCOME}; see the playwright-quarantine artifact."
          fi
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/app/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright test results (visual diffs + traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/app/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the quarantine project's report and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-quarantine
          path: |
            frontend/app/playwright-report-quarantine/
            frontend/app/test-results-quarantine/
          if-no-files-found: ignore
          retention-days: 14

  # plan PR 2 / workstream B3 (extends).
  # The plan says "Extends the existing `rust` job with `npm run
  # native:acceptance` after `native:test`." Since the 2026-09 audit
  # remediation (Slice 2) the acceptance harness runs the engine in simulated
  # audio input mode by default, so it needs no TotalMix and never writes to a
  # console; the audio probe, sync and recall assertions all run against the
  # simulated console. The live lane (`SSE_NATIVE_ACCEPTANCE_LIVE_CONSOLE=1`)
  # exists only for the studio workstation.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-tauri-linux
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
      - run: npm ci
      - run: npm run rust:fmt:check
      - run: npm run rust:clippy
      - run: npm run native:check
      - run: npm run native:test
      # The development build's parity-fixture method and its F04 guards
      # (`parity_fixture_loads_with_feature`, `load_defaults_to_merge`) exist
      # only with the `dev-fixtures` feature, which no other step builds.
      - run: npm run native:test:dev-fixtures
      - run: npm run native:acceptance

  # Production readiness 2026-09, Slice 13 (finding F25): the line-coverage floor
  # of the native workspace. `npm run rust:coverage` runs the same `cargo test
  # --workspace` as the `rust` job, instrumented, and fails under the floor its
  # script carries — the figure this runner measured, minus two points. A job of
  # its own because the instrumented build shares nothing with the plain one
  # (its own cache key) and should not hold up `rust`. Test builds still drop
  # every datagram aimed at a TotalMix remote port; nothing here reaches hardware.
  rust-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-tauri-linux
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          key: llvm-cov
      - run: npm ci
      # native/rust-toolchain.toml pins the toolchain cargo uses under native/;
      # the component has to be added to that one, so rustup runs from there.
      - name: Install llvm-tools and cargo-llvm-cov
        run: |
          (cd native && rustup component add llvm-tools-preview)
          cargo install cargo-llvm-cov --locked --version 0.9.1
      - run: npm run rust:coverage

  # plan PR 2 / workstream B4.
  # `tauri:foundation` = protocol:generate + native:engine:build +
  # tauri:build + tauri:smoke. tauri:smoke is stdin/stdout only (no
  # display required), but tauri:build needs the WebKitGTK toolchain
  # from the composite action.
  tauri-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-tauri-linux
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          # Distinct cache key from the `rust` job — that one targets debug
          # `studio-control-engine` profile, this one builds the full Tauri
          # shell. Sharing the cache key would thrash the smaller scope.
          shared-key: tauri-foundation
      - run: npm ci
      - run: npm run tauri:foundation

  # plan PR 2b / workstream B5.
  # `tauri:setup-support:qualify` + `tauri:workspaces:qualify` spawn the
  # Tauri shell via `tauri dev --features test-bridge`. The shell opens a
  # WebKitGTK window, so the runner needs an X server — `xvfb-run -a`
  # gives each command its own auto-allocated display. Both qualifications
  # bind 127.0.0.1:4173 (Vite preview) with --strictPort, so they run
  # serially within this job and on a separate runner from `frontend-e2e`
  # (which also binds 4173) per the plan's preferred isolation.
  #
  # PR 2b additions (vs the iteration deferred in PR 2):
  # - `SSE_TAURI_QUALIFICATION_TIMEOUT_MS`: extends the qualification
  #   scripts' default `waitForStatus` deadline (40s) — far too tight for
  #   the engine's first health snapshot on ubuntu-latest's xvfb software
  #   rendering, which takes ~30-90s on cold runs.
  # - `LIBGL_ALWAYS_SOFTWARE`: forces Mesa software rasterization so the
  #   WebKitGTK shell skips the `DRI3 device` probe (which fails on
  #   xvfb-only runners with a misleading 30s-ish hang during init).
  qualification:
    runs-on: ubuntu-latest
    # `tauri-foundation` builds the full Tauri shell crate from cold cache.
    # We reuse its `rust-cache` via the same `shared-key` so the qualification
    # scripts' `tauri dev` invocation finds a populated target dir. `needs:`
    # enforces the cache-write/read ordering.
    needs: tauri-foundation
    env:
      # Persist the qualification evidence inside the workspace so the
      # upload-artifact step can grab it (the default temp-dir behavior
      # leaves it on the runner).
      SSE_TAURI_QUALIFICATION_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/qualification
      # 3 min per waitForStatus phase. The qualification scripts default to
      # 40s; that worked on the operator laptop but not on ubuntu-latest.
      SSE_TAURI_QUALIFICATION_TIMEOUT_MS: "180000"
      # Force Mesa software rendering so the WebKitGTK shell does not try
      # (and fail) to probe a DRI3 device under xvfb. Without this, the
      # engine's first health snapshot is delayed by the libEGL fallback.
      LIBGL_ALWAYS_SOFTWARE: "1"
      # Mirror of B3's `SSE_NATIVE_ACCEPTANCE_SKIP_AUDIO_SYNC`. CI runners
      # have no RME TotalMix on 127.0.0.1, so the workspace qualification's
      # `audioSnapshot.verified === true` assertion (and the post-restart
      # audio-state checks) would always fail. Skipping that block keeps
      # the lighting + planning + restart parity assertions intact. Local
      # runs without this env var still require live TotalMix.
      SSE_TAURI_QUALIFICATION_SKIP_AUDIO_PROBE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-tauri-linux
      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          # Share `tauri-foundation`'s populated cache (see `needs:`
          # comment above).
          shared-key: tauri-foundation
      - run: npm ci
      - name: Pre-build the Tauri shell binary
        # `tauri dev` would otherwise cold-compile the shell crate inside
        # the qualification script's waitForStatus window. Pre-building
        # means `tauri dev` finds an up-to-date binary and reaches
        # "initial ready state" well inside the timeout. The `--features
        # test-bridge` flag mirrors what
        # `frontend/app/package.json:tauri:dev` invokes.
        working-directory: native/tauri-shell
        run: cargo build --features test-bridge
      - name: Tauri Setup/Support qualification
        run: xvfb-run -a npm run tauri:setup-support:qualify
      - name: Tauri workspace qualification
        run: xvfb-run -a npm run tauri:workspaces:qualify
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-qualification-evidence
          path: ${{ github.workspace }}/artifacts/qualification/
          if-no-files-found: ignore
          retention-days: 14
