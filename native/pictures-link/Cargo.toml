[package]
name = "studio-control-pictures"
version = "0.1.0"
description = "The cameras' pictures, in a process of their own that the engine starts, steers and stops (D28)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "studio-control-pictures"
path = "src/main.rs"

[dependencies]
studio-control-protocol.workspace = true

# The pictures are drawn with Direct3D 11 into a composition surface of the
# shell's (`renderer.rs`, D30), and vMix's are received with NDI's library,
# loaded by its full path (`ndi_library.rs`, D33). The crate is the one the
# shell and Tauri's wry already lock, so nothing new is fetched; the Linux CI
# builds do not see it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
] }

# The workspace's lints ([workspace.lints] in native/Cargo.toml), with one
# difference, as in the shell: `unsafe_code` is `deny` here, not `forbid`,
# because a `forbid` cannot be lifted even for one item. The functions of
# `renderer.rs` that call Direct3D and those of `ndi_library.rs` that call
# NDI's library carry an `#[allow(unsafe_code)]` each, all Windows only, and
# anything else that uses `unsafe` still fails the build.
# `scripts/check-no-shortcuts.test.mjs` holds the list.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
