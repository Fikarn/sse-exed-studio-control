[package]
name = "sse-exed-tauri-shell"
version = "2.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Enables the shell_test_bridge_* Tauri commands used by Playwright + smoke
# harnesses to drive the shell over a file-backed status/command channel.
# Production builds must NOT enable this feature.
test-bridge = []

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
studio-control-protocol.workspace = true
# The pictures' frame listener's secret (`shell_pictures.rs`): the version the
# engine takes for the deck's token, already in the lock file.
getrandom.workspace = true
tauri = { version = "2.11.2", features = [] }
# One shell per workstation: a second launch hands its arguments to the running
# one and exits (2026-09 production readiness, Slice 5 - finding F19).
tauri-plugin-single-instance = "2.4.4"

# New pages program, Slice 3 (decision 12): on Windows the shell switches
# WebView2's own browser keys off (reload, find, print, zoom, back). Both crates
# are already in the lock file through Tauri and wry, at these versions, so
# nothing new is fetched; the Linux CI builds do not see them.
#
# The Prompter XL's window: the screens are read from Windows' display
# configuration (`shell_displays.rs`), which is the crate's feature
# `Win32_Devices_Display`. The crate is the one already locked.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Foundation"] }

# The workspace's lints ([workspace.lints] in native/Cargo.toml), with one
# difference: `unsafe_code` is `deny` here, not `forbid`, because a `forbid`
# cannot be lifted even for one item. Two functions carry an
# `#[allow(unsafe_code)]`, both Windows only, and anything else that uses
# `unsafe` still fails the build:
#
# - `set_browser_accelerator_keys_off` in shell_browser_keys.rs: WebView2's
#   settings are COM calls, which are `unsafe` in the `windows` bindings
#   (decision 12).
# - `read_display_paths` in shell_displays.rs: Windows' display configuration
#   is read through calls of user32 that fill lists and unions.
#
# `scripts/check-no-shortcuts.test.mjs` holds the list.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
