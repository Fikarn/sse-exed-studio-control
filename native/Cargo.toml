[workspace]
resolver = "2"
members = ["protocol/rust", "rust-engine", "tauri-shell"]

[workspace.package]
edition = "2021"
rust-version = "1.95"
# The repository's licence (`LICENSE`, `package.json`). Named here so the
# licence check and the release SBOMs describe our own three crates instead of
# reporting them as unlicensed (2026-09 production readiness, Slice 12 — F17).
license = "MIT"
# None of the three crates is a crates.io package; refusing `cargo publish`
# also lets `cargo deny` accept the version-less path dependency on
# `studio-control-protocol`.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rosc = "0.11.4"
# OS-seeded randomness for the control-surface bridge token (2026-09
# production readiness, Slice 2 — finding F01). The 0.3 line was already in
# the lock file through the Tauri shell, so no new crate is fetched.
getrandom = "0.3"
studio-control-protocol = { path = "protocol/rust" }
# Pinned to a minor range so generated TypeScript stays stable. Bumping
# the minor must be paired with a `npm run protocol:generate` regen run
# and a check of any diff in frontend/packages/engine-client/src/generated/.
ts-rs = { version = "12", features = ["serde-compat"] }

# Workspace-wide lints. The root `rust:clippy` npm lane denies warnings so
# warning regressions fail the local and CI health gates.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
