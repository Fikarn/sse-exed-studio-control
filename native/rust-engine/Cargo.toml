[package]
name = "studio-control-engine"
version = "2.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Enables ts-rs `#[derive(TS)]` on snapshot types and triggers TypeScript
# binding export when `cargo test --features ts-rs` runs. Production
# builds must NOT enable this feature; it adds a dev-only dependency.
ts-rs = ["dep:ts-rs"]

[dependencies]
rusqlite.workspace = true
rosc.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
studio-control-protocol.workspace = true
ts-rs = { workspace = true, optional = true }
# The Teleprompter's import (new pages program, Slice 4): a Word document is a
# zip of XML parts. The hardware link reads it itself with these three, each
# already in the lock file through Tauri (flate2, plist, the shell's crates),
# so no new crate is fetched: miniz_oxide inflates the zip's entries,
# quick-xml reads word/document.xml, and base64 decodes the bytes the page's
# file picker sends.
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
quick-xml = "0.42"
base64 = "0.22.1"

# CAM 1 over Bluetooth (the Pocket's link, 2026-10-06): Windows' own pairing
# and GATT through the `windows` crate, the one the shell and the pictures
# helper already lock (0.61); these are new features of it, and nothing new is
# fetched. WinRT's calls are safe code, so the workspace's `forbid(unsafe_code)`
# stands.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }

[dev-dependencies]
# Property tests for the two parsers that read bytes from outside the process:
# the control-surface bridge's HTTP reader and the TotalMix OSC ingest (2026-09
# production readiness, Slice 13 - finding F25). Test builds only; `std` alone
# leaves out the process-forking runner and its crates, which nothing here uses.
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints]
workspace = true
